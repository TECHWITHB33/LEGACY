name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  # Rust Backend Tests
  backend-tests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: stable
        override: true
        components: rustfmt, clippy
    
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: backend
    
    - name: Install SQLite
      run: sudo apt-get install -y sqlite3 libsqlite3-dev
    
    - name: Run clippy
      working-directory: backend
      run: cargo clippy --all-targets -- -D warnings
    
    - name: Check formatting
      working-directory: backend
      run: cargo fmt -- --check
    
    - name: Build
      working-directory: backend
      run: cargo build --verbose
    
    - name: Run tests
      working-directory: backend
      run: cargo test --verbose
    
    - name: Check security
      working-directory: backend
      run: cargo audit

  # Frontend (Streamlit) Tests
  frontend-streamlit-tests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest black flake8 mypy
    
    - name: Code formatting check
      working-directory: frontend_streamlit
      run: black --check .
    
    - name: Lint
      working-directory: frontend_streamlit
      run: flake8 .
    
    - name: Type check
      working-directory: frontend_streamlit
      run: mypy . --ignore-missing-imports
    
    - name: Run tests
      working-directory: frontend_streamlit
      run: pytest tests/ -v

  # Frontend (React) Tests
  frontend-react-tests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: 'frontend_react/package-lock.json'
    
    - name: Install dependencies
      working-directory: frontend_react
      run: npm ci
    
    - name: Lint
      working-directory: frontend_react
      run: npm run lint
    
    - name: Type check
      working-directory: frontend_react
      run: npx tsc --noEmit
    
    - name: Build
      working-directory: frontend_react
      run: npm run build
    
    - name: Run tests
      working-directory: frontend_react
      run: npm test -- --run

  # Docker Build Check
  docker-build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: docker/setup-buildx-action@v2
    
    - name: Build backend image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./docker/backend.Dockerfile
        push: false
        tags: id-card-backend:latest
    
    - name: Build Streamlit image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./docker/streamlit.Dockerfile
        push: false
        tags: id-card-frontend-streamlit:latest
    
    - name: Build React image
      uses: docker/build-push-action@v4
      with:
        context: ./frontend_react
        file: ./docker/react.Dockerfile
        push: false
        tags: id-card-frontend-react:latest

  # Security Scan
  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

  # Code Quality
  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
