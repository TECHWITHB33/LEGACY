name: Deploy to Production

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: docker/setup-buildx-action@v2

    - name: Normalize image name
      id: image-name
      run: echo "value=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
    
    - uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    # Build and push backend
    - uses: docker/build-push-action@v4
      with:
        context: .
        file: ./docker/backend.Dockerfile
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ steps.image-name.outputs.value }}/backend:latest
          ${{ env.REGISTRY }}/${{ steps.image-name.outputs.value }}/backend:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    # Build and push Streamlit
    - uses: docker/build-push-action@v4
      with:
        context: .
        file: ./docker/streamlit.Dockerfile
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ steps.image-name.outputs.value }}/frontend-streamlit:latest
          ${{ env.REGISTRY }}/${{ steps.image-name.outputs.value }}/frontend-streamlit:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    # Build and push React
    - uses: docker/build-push-action@v4
      with:
        context: ./frontend_react
        file: ./docker/react.Dockerfile
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ steps.image-name.outputs.value }}/frontend-react:latest
          ${{ env.REGISTRY }}/${{ steps.image-name.outputs.value }}/frontend-react:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy to Staging
      env:
        DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        DEPLOY_HOST: ${{ secrets.DEPLOY_HOST_STAGING }}
        DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      run: |
        mkdir -p ~/.ssh
        echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts
        ssh -i ~/.ssh/deploy_key $DEPLOY_USER@$DEPLOY_HOST << 'EOF'
          cd /app/id-card-system
          git pull origin main
          docker-compose pull
          docker-compose up -d
        EOF

  deploy-production:
    needs: [build-and-push, deploy-staging]
    runs-on: ubuntu-latest
    environment: production
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy to Production
      env:
        DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        DEPLOY_HOST: ${{ secrets.DEPLOY_HOST_PROD }}
        DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      run: |
        mkdir -p ~/.ssh
        echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts
        ssh -i ~/.ssh/deploy_key $DEPLOY_USER@$DEPLOY_HOST << 'EOF'
          cd /app/id-card-system
          git pull origin main
          docker-compose pull
          docker-compose up -d
          docker-compose exec backend ./id-card-system migrate
        EOF
    
    - name: Notification
      uses: 8398a7/action-slack@v3
      if: always()
      with:
        status: ${{ job.status }}
        text: 'Production deployment ${{ job.status }}'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
