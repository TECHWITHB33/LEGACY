name: Enhanced CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  RUST_BACKTRACE: 1

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
    - name: Format check
      working-directory: backend
      run: cargo fmt -- --check
    - name: Clippy lint
      working-directory: backend
      run: cargo clippy --all-targets -- -D warnings
    - name: Build
      working-directory: backend
      run: cargo build --verbose
    - name: Run tests
      working-directory: backend
      run: cargo test --verbose
    - name: Security audit
      working-directory: backend
      run: cargo audit

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v3
      with:
        node-version: '18'
    - name: Install
      working-directory: frontend_react
      run: npm ci
    - name: Lint
      working-directory: frontend_react
      run: npm run lint
    - name: Build
      working-directory: frontend_react
      run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v2
    - name: Build
      run: docker build -f docker/backend.Dockerfile -t backend .
